<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal Logo with Text -->
  <!-- Nested Squares -->
  <rect x="60" y="50" width="160" height="160" fill="none" stroke="#001f5c" stroke-width="12"/>
  <rect x="90" y="80" width="130" height="130" fill="none" stroke="#0052cc" stroke-width="12"/>
  
  <!-- A Triangle -->
  <polygon points="140,90 160,140 120,140" fill="#001f5c"/>
  
  <!-- S Shape -->
  <path d="M 145 160 Q 155 165 150 175 Q 145 180 135 175 Q 130 170 140 165 Q 150 160 145 155" fill="#0052cc"/>
  
  <!-- Curved line accent -->
