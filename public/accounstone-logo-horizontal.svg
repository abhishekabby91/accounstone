  <!-- Text -->
  <text x="280" y="130" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#001f5c">ACCOUN</text>
  <text x="835" y="130" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#ff6600">O</text>
