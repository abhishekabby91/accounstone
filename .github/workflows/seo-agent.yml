name: Accounstone SEO Agent

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SEO agent
        run: npm run seo:agent

      - name: Commit updated SEO report
        run: |
          git config user.name "Accounstone SEO Agent"
          git config user.email "actions@github.com"
          git add seo-agent/reports/
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: update SEO agent report"
            git push origin main
          fi
